<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Hotline</title>

    <!-- daisy ui cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />

    <!-- tailwind  cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font  awesome cdn -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> -->
      <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
  <div>
    <!-- navbar section -->
    <div class="max-w-full h-23 flex justify-between items-center pl-5 bg-[#FFFFFF]">
      <!-- left section -->
       <div class="flex gap-3 items-center">
           <img class="w-12 h-12" src="assets/logo.png" alt="">
           <p class="font-bold leading-5 text-xl text-[#006747]">Emergency<br>Service</p>     
       </div>
       <!-- right section -->
        <div class="flex gap-5 pr-5">
          <!-- heart counter -->
           <div class="bg-[#41FF6B1A] rounded-full px-8 py-2 flex gap-2 items-center  text-xl font-bold">
            <span>0</span>
            <i class="fa-solid fa-heart text-[#ED1C24]"></i>
           </div>

           <!-- coin counter counter -->
            <div class="bg-[#41FF6B1A] rounded-full px-5 py-3 flex gap-2 items-center text-xl font-bold">
            <span>100</span>
           <i class="fa-solid fa-coins text-[#FCD227]"></i>
           </div>

            <!-- copy button -->
             <button class="btn btn-active bg-[#00A63E] text-lg font-medium text-[#FFFFFF] rounded-full px-7 py-6"><span>0</span>Copy</button>
        </div>
    </div>
  </div>
    

<script src="js/script.js"></script>
</body>
</html>
